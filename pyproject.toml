[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respectscraper"
dynamic = ["version"]
description = "Crawl websites within their robots.txt (RFC 9309), with a recorded reason for every request."
authors = [{ name = "Zakhele Gamede", email = "gamedevoxzakhele@gmail.com" }]
maintainers = [{ name = "Zakhele Gamede", email = "gamedevoxzakhele@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["scraping", "crawler", "robots.txt", "rfc9309", "ethical", "pdf", "docx", "xlsx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/Zakhele-TechWannabe/respectscraper"
Issues = "https://github.com/Zakhele-TechWannabe/respectscraper/issues"
Changelog = "https://github.com/Zakhele-TechWannabe/respectscraper/blob/main/CHANGELOG.md"
Security = "https://github.com/Zakhele-TechWannabe/respectscraper/security/policy"
Author = "https://zakhelegamede.co.za"

[project.scripts]
respectscraper = "respectscraper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "respectscraper._version.__version__" }

[tool.setuptools.packages.find]
include = ["respectscraper*", "webscraper*"]

[tool.setuptools.package-data]
respectscraper = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "SIM", "UP", "W"]
ignore = ["S113"]  # requests calls always pass a timeout; S113 misreads the session wrapper

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S310"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["respectscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:respectscraper.*"]
